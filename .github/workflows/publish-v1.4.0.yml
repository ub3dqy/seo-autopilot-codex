name: Publish SEO Autopilot v1.4.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.4.0.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-autopilot-v1.4.0-publish
  cancel-in-progress: false

jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: v1.4.0
      USER_ARCHIVE: seo-autopilot-codex-user-v1.4.0.zip
      ENGINEERING_ARCHIVE: seo-autopilot-codex-engineering-v1.4.0.zip
      USER_SHA256: e03e522fb7767ad7597452fac78cb982aac4c83337573054a32b3f19516d399e
      ENGINEERING_SHA256: 27791aa36257d878c87bc591a03f25ff21ec79fec5251ef34c4a2fe67126db45
      SOURCE_COMMIT: ad4a15dd9be5637d6f0cf942a2584b86e8617316

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reconstruct immutable engineering archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          BASE="https://raw.githubusercontent.com/ub3dqy/codex-plugin-cc/${SOURCE_COMMIT}/seo-autopilot-codex/.release-payload/v1.4.0/engineering"
          for part in 000 001 002 003; do
            curl --fail --silent --show-error --location "$BASE/part-$part"
          done | base64 --decode > "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"
          printf '%s  %s\n' "$ENGINEERING_SHA256" "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE" | sha256sum --check --strict

      - name: Safely extract engineering edition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "dist" / os.environ["ENGINEERING_ARCHIVE"]
          destination = Path(os.environ["RUNNER_TEMP"]) / "engineering-unzip"
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe ZIP path: {info.filename}")
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"ZIP links are not allowed: {info.filename}")
              zf.extractall(destination)
          PY
          ENGINEERING_ROOT="$RUNNER_TEMP/engineering-unzip/seo-autopilot-codex-engineering-v1.4.0"
          test -f "$ENGINEERING_ROOT/README.md"
          echo "ENGINEERING_ROOT=$ENGINEERING_ROOT" >> "$GITHUB_ENV"

      - name: Run deterministic checks
        working-directory: ${{ env.ENGINEERING_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_all_checks.py --package-root . --skip-live

      - name: Build and verify both editions
        working-directory: ${{ env.ENGINEERING_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_user_release.py --package-root . --output-dir "$RUNNER_TEMP/dist"
          python scripts/verify_user_release.py --archive "$RUNNER_TEMP/dist/$USER_ARCHIVE"
          printf '%s  %s\n' "$USER_SHA256" "$RUNNER_TEMP/dist/$USER_ARCHIVE" | sha256sum --check --strict

          mkdir -p "$RUNNER_TEMP/rebuilt"
          python scripts/build_release.py --package-root . --output "$RUNNER_TEMP/rebuilt/$ENGINEERING_ARCHIVE" --skip-checks
          cmp "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE" "$RUNNER_TEMP/rebuilt/$ENGINEERING_ARCHIVE"
          python scripts/verify_release.py --archive "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"
          unzip -t "$RUNNER_TEMP/dist/$USER_ARCHIVE"
          unzip -t "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"

      - name: Safely extract user edition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "dist" / os.environ["USER_ARCHIVE"]
          destination = Path(os.environ["RUNNER_TEMP"]) / "user-unzip"
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe ZIP path: {info.filename}")
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"ZIP links are not allowed: {info.filename}")
              zf.extractall(destination)
          PY
          USER_ROOT="$RUNNER_TEMP/user-unzip/seo-autopilot-codex-user-v1.4.0"
          test -f "$USER_ROOT/README.md"
          echo "USER_ROOT=$USER_ROOT" >> "$GITHUB_ENV"

      - name: Publish browsable source to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf user engineering
          mkdir -p user engineering
          cp -a "$USER_ROOT"/. user/
          cp -a "$ENGINEERING_ROOT"/. engineering/
          cp engineering/CHANGELOG.md CHANGELOG.md
          (
            cd "$RUNNER_TEMP/dist"
            sha256sum "$USER_ARCHIVE" "$ENGINEERING_ARCHIVE"
          ) > SHA256SUMS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "publish: SEO Autopilot v1.4.0 editions"
            git push origin HEAD:main
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(
            "$RUNNER_TEMP/dist/$USER_ARCHIVE"
            "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"
            "SHA256SUMS"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "SEO Autopilot for OpenAI Codex v1.4.0" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "SEO Autopilot for OpenAI Codex v1.4.0" --notes-file RELEASE_NOTES.md
          fi
