name: Materialize verified source tree

on:
  push:
    branches:
      - codex/v1.5-trust-autopilot
    paths:
      - .github/workflows/materialize-source.yml

permissions:
  contents: write

concurrency:
  group: materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize verified editions
        run: python prepare_editions.py

      - name: Record materialized source
        shell: bash
        run: |
          set -euo pipefail
          test -f user/README.md
          test -f engineering/README.md
          printf '%s\n' 'Generated from the verified v1.4.0 source bundle by prepare_editions.py.' > user/.seo-autopilot-generated
          printf '%s\n' 'Generated from the verified v1.4.0 source bundle by prepare_editions.py.' > engineering/.seo-autopilot-generated
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add user engineering
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
            exit 0
          fi
          git commit -m 'chore: expose verified User and Engineering sources'
          git push origin HEAD:${GITHUB_REF_NAME}
