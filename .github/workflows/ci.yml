name: CI

on:
  push:
    branches: [main, codex/v1.5-trust-autopilot]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install package
        run: python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Compile Python source
        run: python -m compileall -q src scripts tests prepare_editions.py

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -v

      - name: Verify release source
        run: python prepare_editions.py --verify-only

      - name: Scan tracked source for secrets
        run: python scripts/secret_scan.py

  package:
    name: Deterministic release package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build twice and compare through release tests
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m unittest tests.test_release -v
          python prepare_editions.py --build-zips --force

      - name: Generate source SBOM
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.pushed_at }}
        run: |
          VERSION="$(cat VERSION)"
          python scripts/generate_sbom.py --output "dist/seo-autopilot-codex-v${VERSION}.spdx.json"

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seo-autopilot-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/release-build.json
            dist/*.spdx.json
          if-no-files-found: error
          retention-days: 14
