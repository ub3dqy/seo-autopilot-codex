name: Bootstrap and publish SEO Autopilot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-publish.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-autopilot-bootstrap-v1.4.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: "1.4.0"
      TAG: "v1.4.0"
      USER_ARCHIVE: "seo-autopilot-codex-user-v1.4.0.zip"
      ENGINEERING_ARCHIVE: "seo-autopilot-codex-engineering-v1.4.0.zip"
      USER_SHA256: "e03e522fb7767ad7597452fac78cb982aac4c83337573054a32b3f19516d399e"
      ENGINEERING_SHA256: "27791aa36257d878c87bc591a03f25ff21ec79fec5251ef34c4a2fe67126db45"
      TRANSPORT_SHA256: "27791aa36257d878c87bc591a03f25ff21ec79fec5251ef34c4a2fe67126db45"
      TRANSPORT_COMMIT: "ad4a15dd9be5637d6f0cf942a2584b86e8617316"

    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Reconstruct verified engineering package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/transport"
          : > "$RUNNER_TEMP/transport/engineering.b64"
          for part in 000 001 002 003; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/ub3dqy/codex-plugin-cc/${TRANSPORT_COMMIT}/seo-autopilot-codex/.release-payload/v1.4.0/engineering/part-${part}" \
              >> "$RUNNER_TEMP/transport/engineering.b64"
          done
          base64 --decode "$RUNNER_TEMP/transport/engineering.b64" \
            > "$RUNNER_TEMP/transport/$ENGINEERING_ARCHIVE"
          printf '%s  %s\n' "$TRANSPORT_SHA256" "$RUNNER_TEMP/transport/$ENGINEERING_ARCHIVE" \
            | sha256sum --check --strict

      - name: Safely extract engineering package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/engineering"
          python - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["RUNNER_TEMP"]) / "transport" / os.environ["ENGINEERING_ARCHIVE"]
          destination = Path(os.environ["RUNNER_TEMP"]) / "engineering"
          with zipfile.ZipFile(archive) as handle:
              for info in handle.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe ZIP path: {info.filename}")
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"ZIP symlink is not allowed: {info.filename}")
              handle.extractall(destination)
          PY
          SOURCE_ROOT="$RUNNER_TEMP/engineering/seo-autopilot-codex-engineering-v1.4.0"
          test -f "$SOURCE_ROOT/VERSION"
          test "$(cat "$SOURCE_ROOT/VERSION")" = "$VERSION"
          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Run deterministic engineering checks
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_all_checks.py --skip-live

      - name: Rebuild and verify both editions
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          python scripts/build_user_release.py --package-root . --output-dir "$RUNNER_TEMP/dist"
          python scripts/verify_user_release.py --archive "$RUNNER_TEMP/dist/$USER_ARCHIVE"
          python scripts/build_release.py \
            --package-root . \
            --output "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE" \
            --skip-checks
          python scripts/verify_release.py --archive "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"
          printf '%s  %s\n' "$USER_SHA256" "$RUNNER_TEMP/dist/$USER_ARCHIVE" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$ENGINEERING_SHA256" "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE" \
            | sha256sum --check --strict
          unzip -t "$RUNNER_TEMP/dist/$USER_ARCHIVE"
          unzip -t "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"

      - name: Prepare clean public repository tree
        shell: bash
        run: |
          set -euo pipefail
          USER_EXTRACT="$RUNNER_TEMP/user-extract"
          PUBLISH_DIR="$RUNNER_TEMP/publish"
          mkdir -p "$USER_EXTRACT" "$PUBLISH_DIR/user" "$PUBLISH_DIR/engineering" "$PUBLISH_DIR/.github/workflows"
          unzip -q "$RUNNER_TEMP/dist/$USER_ARCHIVE" -d "$USER_EXTRACT"
          USER_ROOT="$USER_EXTRACT/seo-autopilot-codex-user-v1.4.0"
          test -f "$USER_ROOT/README.md"
          cp -a "$USER_ROOT"/. "$PUBLISH_DIR/user/"
          cp -a "$SOURCE_ROOT"/. "$PUBLISH_DIR/engineering/"

          cat > "$PUBLISH_DIR/README.md" <<'EOF'
          # SEO Autopilot for OpenAI Codex

          SEO Autopilot turns one repository-level request into an end-to-end SEO checkpoint: project detection, safe scope selection, audit, reversible fixes, deterministic validation, regression checks, and a concise evidence report.

          ## Two editions

          - [`user/`](./user/) — simplified edition for everyday use, with one `seo-autopilot` skill and one-click launchers.
          - [`engineering/`](./engineering/) — complete source, contracts, validators, installers, tests, evals, and reproducible release tooling.

          ## Quick start on Windows

          1. Download the User Edition from the latest release.
          2. Extract the ZIP.
          3. Run `1_INSTALL_WINDOWS.cmd` once.
          4. Run `2_RUN_SEO_WINDOWS.cmd` and select the website repository.

          After installation, open a project in Codex and write:

          ```text
          Проведи SEO-оптимизацию этого сайта.
          ```

          Audit-only mode:

          ```text
          $seo-autopilot Проведи только SEO-аудит. Ничего не изменяй.
          ```

          ## Safety

          The tool applies reversible, high-confidence fixes by default. It does not change URLs, delete pages, publish unverified claims, enable tracking, or deploy to production without an explicit decision. Missing external services are marked `DEFERRED` and do not block safe repository work.

          ## Verification status

          - Deterministic unit, fixture, and lifecycle tests: 29/29 PASS.
          - Static behavioral contracts: 24/24 PASS.
          - Package verification and reproducible builds: PASS.
          - Live autonomous Codex behavior: `NOT_RUN` in the original build environment and not represented as PASS.

          See [`engineering/SELF_TEST_REPORT.md`](./engineering/SELF_TEST_REPORT.md) for details.
          EOF

          cat > "$PUBLISH_DIR/LICENSE.md" <<'EOF'
          # Licensing notice

          Copyright © 2026 ub3dqy. All rights reserved.

          The files in this repository are publicly available for inspection and use by the copyright holder. No permission to copy, modify, redistribute, sublicense, or sell these files is granted unless a separate written license is provided.
          EOF

          if test -f "$SOURCE_ROOT/CHANGELOG.md"; then
            cp "$SOURCE_ROOT/CHANGELOG.md" "$PUBLISH_DIR/CHANGELOG.md"
          fi
          cat > "$PUBLISH_DIR/RELEASE_NOTES.md" <<'EOF'
          # SEO Autopilot for Codex v1.4.0

          This release contains two editions built from one canonical engineering source tree.

          - User Edition: one user-facing skill, automatic scope selection, end-to-end audit/fix/validation, and one-click launchers.
          - Engineering Edition: complete contracts, validators, tests, evals, lifecycle tooling, and reproducible release builders.

          Deterministic tests and package verification passed. The live autonomous Codex behavioral suite remains `NOT_RUN` and is not represented as PASS.
          EOF
          printf '%s  %s\n' "$USER_SHA256" "$USER_ARCHIVE" > "$PUBLISH_DIR/SHA256SUMS"
          printf '%s  %s\n' "$ENGINEERING_SHA256" "$ENGINEERING_ARCHIVE" >> "$PUBLISH_DIR/SHA256SUMS"
          printf 'dist/\n__pycache__/\n*.pyc\n*.pyo\n' > "$PUBLISH_DIR/.gitignore"

          cat > "$PUBLISH_DIR/.github/workflows/ci.yml" <<'EOF'
          name: SEO Autopilot CI

          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 35
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.13"
                - name: Run deterministic checks
                  working-directory: engineering
                  run: python scripts/run_all_checks.py --skip-live
                - name: Build and verify User Edition
                  working-directory: engineering
                  run: |
                    rm -rf dist
                    python scripts/build_user_release.py --package-root . --output-dir dist
                    python scripts/verify_user_release.py --archive dist/seo-autopilot-codex-user-v1.4.0.zip
                    echo 'e03e522fb7767ad7597452fac78cb982aac4c83337573054a32b3f19516d399e  dist/seo-autopilot-codex-user-v1.4.0.zip' | sha256sum --check --strict
                - name: Build and verify Engineering Edition
                  working-directory: engineering
                  run: |
                    python scripts/build_release.py --package-root . --output dist/seo-autopilot-codex-engineering-v1.4.0.zip --skip-checks
                    python scripts/verify_release.py --archive dist/seo-autopilot-codex-engineering-v1.4.0.zip
                    echo '27791aa36257d878c87bc591a03f25ff21ec79fec5251ef34c4a2fe67126db45  dist/seo-autopilot-codex-engineering-v1.4.0.zip' | sha256sum --check --strict
          EOF
          echo "PUBLISH_DIR=$PUBLISH_DIR" >> "$GITHUB_ENV"

      - name: Replace main with the clean project tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$PUBLISH_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: SEO Autopilot for Codex v1.4.0"
          git branch -M main
          PUBLISH_SHA="$(git rev-parse HEAD)"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/main
          echo "PUBLISH_SHA=$PUBLISH_SHA" >> "$GITHUB_ENV"

      - name: Create or update public release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(
            "$RUNNER_TEMP/dist/$USER_ARCHIVE"
            "$RUNNER_TEMP/dist/$ENGINEERING_ARCHIVE"
            "$PUBLISH_DIR/SHA256SUMS"
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SEO Autopilot for Codex v1.4.0" \
              --notes-file "$PUBLISH_DIR/RELEASE_NOTES.md"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$PUBLISH_SHA" \
              --title "SEO Autopilot for Codex v1.4.0" \
              --notes-file "$PUBLISH_DIR/RELEASE_NOTES.md"
          fi
