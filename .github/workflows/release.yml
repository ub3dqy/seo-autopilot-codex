name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag and canonical version
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${VERSION}" >&2
            exit 1
          }

      - name: Run release gates
        run: |
          python -m pip install --disable-pip-version-check --no-deps -e .
          python -m compileall -q src scripts tests prepare_editions.py
          python -m unittest discover -s tests -v
          python scripts/secret_scan.py
          python prepare_editions.py --verify-only

      - name: Build deterministic editions
        run: python prepare_editions.py --build-zips --force

      - name: Assemble release assets and SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p release
          cp dist/*.zip release/
          cp dist/release-build.json release/
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            python scripts/generate_sbom.py \
              --output "release/seo-autopilot-codex-v${VERSION}.spdx.json"
          (cd release && sha256sum * > SHA256SUMS)
          (cd release && sha256sum --check SHA256SUMS)

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.zip
            release/*.json
            release/SHA256SUMS

      - name: Publish immutable-ready GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/* \
            --verify-tag \
            --title "SEO Autopilot ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md

      - name: Upload release evidence to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 90
